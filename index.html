<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>VIDÉOCLUB PRO</title>
  <style>
    :root {
      --primary: #ff0033;
      --bg-dark: #060507;
      --surface: #111015;
      --text: #ffffff;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      width: 100vw;
      height: 100vh;
    }

    /* Écran de chargement initial */
    #boot-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20000;
    }
    .boot-text {
      color: #ffffff;
      font-size: 14px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      margin-top: 25px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.5;
    }

    .netflix-loader {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 0, 51, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spinLoader 0.8s linear infinite;
    }
    @keyframes spinLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Structure Principale - Zone Aperçu Netflix TV (240px) */
    .app-layout {
      display: grid;
      grid-template-rows: 75px 240px 1fr;
      width: 100%;
      height: 100vh;
      box-sizing: border-box;
    }

    /* Entête optimisée */
    .header-zone {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
      position: relative;
      z-index: 50;
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .text-logo {
      font-size: 22px;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255, 0, 51, 0.5);
      margin: 0;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 2px;
    }
    .status-text {
      font-size: 10px;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .clock-text {
      font-size: 11px;
      font-weight: 600;
      color: #ffffff;
      opacity: 0.8;
    }
    
    /* Zone recherche */
    .search-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .search-input {
      background-color: var(--surface);
      border: 2px solid transparent;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
      width: 220px;
      transition: all 0.2s;
    }
    .search-input:focus, .search-input.focused {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(255, 0, 51, 0.3);
    }
    .search-button {
      background-color: var(--surface);
      color: white;
      border: 2px solid transparent;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .search-button:focus, .search-button.focused {
      background-color: var(--primary);
      border-color: white;
    }

    /* Section Aperçu TV Netflix Style Arrière-plan */
    .hero-preview-zone {
      position: relative;
      display: flex;
      box-sizing: border-box;
      background-color: #000;
      width: 100%;
      height: 100%;
    }
    
    .hero-bg-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      overflow: hidden;
    }
    .hero-video-iframe {
      width: 100%; height: 100%; border: none;
      pointer-events: none; 
      transform: scale(1.6) translateY(-5%); 
      transform-origin: center center;
    }
    .hero-bg-fade {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to right, rgba(6,5,7,1) 0%, rgba(6,5,7,0.85) 35%, rgba(6,5,7,0) 80%),
                  linear-gradient(to top, rgba(6,5,7,1) 0%, transparent 40%);
      z-index: 2;
    }
    .hero-text-content {
      position: relative;
      z-index: 10;
      max-width: 55%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      padding: 0 40px;
      height: 100%;
    }
    .hero-title {
      font-size: 26px;
      font-weight: 800;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 4px #000;
    }
    .hero-meta {
      font-size: 13px;
      color: #ffb703;
      font-weight: 600;
      text-shadow: 0 1px 3px #000;
    }
    .hero-overview {
      font-size: 13px;
      color: #dddddd;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0;
      text-shadow: 0 1px 3px #000;
    }

    /* Catalogue en Lignes Flottantes */
    .catalog-rows-container {
      overflow-y: auto;
      padding: 10px 40px 30px 40px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      z-index: 20;
    }
    .catalog-rows-container::-webkit-scrollbar { display: none; }
    
    .row-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: #e2e2e2;
    }
    .horizontal-slider {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 5px 0;
    }
    .horizontal-slider::-webkit-scrollbar { display: none; }

    /* Posters Catalogue Réduits et Visibles */
    .movie-card {
      width: 105px;
      height: 157px;
      flex-shrink: 0;
      background-color: var(--surface);
      border-radius: 6px;
      overflow: hidden;
      border: 3px solid transparent;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.15s ease;
      position: relative;
    }
    .card-poster {
      width: 100%; height: 100%; object-fit: cover; background-color: #222;
    }
    .movie-card:focus, .movie-card.focused {
      outline: none;
      transform: scale(1.1);
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(255, 0, 51, 0.6);
      z-index: 10;
    }

    /* Zone Grand Lecteur Vidéo Plein Écran */
    #video-container {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000000; z-index: 15000;
    }
    #video-player { width: 100%; height: 100%; background: #000000; object-fit: cover; }
    #player-loading-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #000000; display: flex; align-items: center; justify-content: center;
      z-index: 16000; pointer-events: none;
    }
    #seek-hud {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.65); border: 1.5px solid rgba(255, 0, 51, 0.3);
      padding: 18px 36px; border-radius: 10px; text-align: center; z-index: 15500; display: none;
    }
    .seek-text-val { font-size: 32px; font-weight: 800; color: var(--primary); }
    .player-controls-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
      padding: 40px 30px 25px 30px; display: flex; flex-direction: column; gap: 14px;
      opacity: 0; transition: opacity 0.25s; z-index: 15200;
    }
    .player-controls-bar.show { opacity: 1; }
    .progress-wrapper { width: 100%; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: var(--primary); }
    .ctrl-buttons-line { display: flex; align-items: center; justify-content: center; gap: 24px; }
    .round-player-btn {
      width: 44px; height: 44px; border-radius: 50%; background-color: #000000;
      border: 2px solid #ffffff; fill: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none;
    }
    .round-player-btn svg { width: 20px; height: 20px; }
    .round-player-btn:focus, .round-player-btn.focused { background-color: #ffffff; border-color: var(--primary); fill: #000000; transform: scale(1.1); }
    .player-txt-info { display: flex; justify-content: space-between; font-size: 13px; color: #ccc; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <div id="boot-screen">
    <div class="netflix-loader"></div>
    <div class="boot-text" id="boot-status-text">CONNEXION AU SERVEUR CINÉMA...</div>
  </div>

  <div class="app-layout">
    
    <div class="header-zone">
      <div class="logo-container">
        <h1 class="text-logo">VidéoClub</h1>
        <div class="status-row">
          <span class="status-text">Connecté</span>
          <span class="clock-text" id="live-clock">--:--</span>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="search-query" class="search-input" placeholder="Rechercher un film...">
        <button class="search-button" id="search-btn" onclick="triggerSearch()">OK</button>
      </div>
    </div>

    <div class="hero-preview-zone" id="hero-banner">
      <div class="hero-bg-container" id="hero-video-container"></div>
      <div class="hero-gradient-overlay"></div>
      <div class="hero-text-content">
        <h2 class="hero-title" id="hero-title">Chargement...</h2>
        <div class="hero-meta" id="hero-meta">-- - -- ★</div>
        <p class="hero-overview" id="hero-overview">Sélectionnez un film pour voir son résumé et sa bande-annonce.</p>
      </div>
    </div>

    <div class="catalog-rows-container" id="catalog-rows-box"></div>

  </div>

  <div id="video-container">
    <div id="player-loading-overlay"><div class="netflix-loader"></div></div>
    <div id="seek-hud"><div class="seek-text-val" id="seek-hud-val">+10s</div></div>
    <video id="video-player" playsinline></video>
    <div class="player-controls-bar" id="player-ui-controls">
      <div class="player-txt-info">
        <span id="player-movie-title">Film</span>
        <span id="player-time-display">00:00 / 00:00</span>
      </div>
      <div class="progress-wrapper"><div class="progress-fill" id="player-progress-bar"></div></div>
      <div class="ctrl-buttons-line">
        <button class="round-player-btn" id="p-btn-rewind" onclick="playerRewind(event)">
          <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button class="round-player-btn" id="p-btn-play" onclick="playerTogglePlay(event)">
          <svg id="p-svg-play" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="round-player-btn" id="p-btn-forward" onclick="playerForward(event)">
          <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
        </button>
        <button class="round-player-btn" id="p-btn-ratio" onclick="playerCycleRatio(event)">
          <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.11 0-2 .89-2 2v14c0 1.1.89 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2zm0 16H3V5h18v14z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    var TMDB_API_KEY = "0442e5116bf1245dce171d5ed8a7748c";
    var DROPBOX_JSON_URL = ""; 

    var FALLBACK_MOVIE_JSON = {
      "Dernier ajouts": ["Inception", "Interstellar", "Gladiator II", "Avatar: La voie de l'eau"],
      "action": ["John Wick 4", "The Dark Knight", "Top Gun: Maverick", "Mad Max: Fury Road"],
      "humour": ["Astérix & Obélix: Mission Cléopâtre", "Le Dîner de Cons", "Babysitting", "Les Visiteurs"],
      "horreur": ["Conjuring", "Sinister", "Alien: Romulus", "Smile"],
      "animé": ["Demon Slayer: Le train de l'infini", "Le Voyage de Chihiro", "Jujutsu Kaisen 0"],
      "animation": ["Shrek", "Toy Story", "Le Roi Lion", "Spider-Man: Across the Spider-Verse"],
      "drame": ["The Green Mile", "Forrest Gump", "Oppenheimer", "Le Pianiste"],
      "aventure": ["Le Seigneur des Anneaux", "Indiana Jones", "Uncharted", "Avatar"]
    };

    var currentApiUrl = "https://api.purstream.store/api/v1";
    var structuralCatalog = {}; 
    var currentZone = "catalog"; 
    var activeRowIndex = 0;
    var activeColIndex = 0;
    var activePlayerControlIndex = 1; 

    var previewDebounceTimer = null;
    var uiControlsTimer = null;
    var seekAccumulator = 0;
    var seekDebounceTimer = null;
    var ratioModes = ["cover", "contain", "fill"];
    var currentRatioIndex = 0;
    var video = document.getElementById('video-player');

    window.onload = function() {
      setupHardwareBackButton();
      detectPurstreamDomain();
      loadMoviesDatabase();
      initClock();
    };

    function initClock() {
      function updateClock() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        h = h < 10 ? '0' + h : h;
        m = m < 10 ? '0' + m : m;
        document.getElementById('live-clock').innerText = h + ":" + m;
      }
      updateClock(); setInterval(updateClock, 1000);
    }

    function setupHardwareBackButton() {
      window.history.pushState({page: 'home'}, 'Home', '#/');
      window.addEventListener('popstate', function(e) {
        if (isPlayerOpen()) closePlayer();
        window.history.pushState({page: 'home'}, 'Home', '#/');
      });
    }

    function isPlayerOpen() { return document.getElementById('video-container').style.display === 'block'; }

    function detectPurstreamDomain() {
      fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://purstream.wiki/'))
        .then(function(res) { return res.text(); })
        .then(function(html) {
          var match = html.match(/https?:\/\/purstream\.[a-z]+/gi);
          var tld = "store";
          if (match) {
            var domains = match.filter(function(u) { return u.toLowerCase().indexOf('purstream.wiki') === -1; });
            if (domains.length) tld = domains[domains.length - 1].toLowerCase().replace(/https?:\/\/purstream\./, '').replace(/\/$/, '');
          }
          currentApiUrl = 'https://api.purstream.' + tld + '/api/v1';
        }).catch(function() { currentApiUrl = 'https://api.purstream.store/api/v1'; });
    }

    function loadMoviesDatabase() {
      if (DROPBOX_JSON_URL && DROPBOX_JSON_URL.trim() !== "") {
        fetch(DROPBOX_JSON_URL)
          .then(function(res) { return res.json(); })
          .then(function(data) { processCatalogData(data); })
          .catch(function() { processCatalogData(FALLBACK_MOVIE_JSON); });
      } else {
        processCatalogData(FALLBACK_MOVIE_JSON);
      }
    }

    function processCatalogData(jsonCatalog) {
      structuralCatalog = {};
      var fetchPromises = [];
      Object.keys(jsonCatalog).forEach(function(category) {
        structuralCatalog[category] = [];
        jsonCatalog[category].forEach(function(title) {
          var p = fetch('https://api.themoviedb.org/3/search/movie?api_key=' + TMDB_API_KEY + '&language=fr-FR&query=' + encodeURIComponent(title) + '&include_adult=false')
            .then(function(r) { return r.json(); })
            .then(function(res) { 
              if (res.results && res.results.length > 0) structuralCatalog[category].push(res.results[0]); 
            }).catch(function() {});
          fetchPromises.push(p);
        });
      });

      Promise.all(fetchPromises).then(function() {
        document.getElementById('boot-screen').style.display = 'none';
        buildHorizontalCatalogDOM();
      }).catch(function() {
        document.getElementById('boot-screen').style.display = 'none';
        buildHorizontalCatalogDOM();
      });
    }

    function triggerSearch() {
      var q = document.getElementById('search-query').value.trim();
      if(!q) return;
      document.getElementById('boot-screen').style.display = 'flex';
      document.getElementById('boot-status-text').innerText = "RECHERCHE EN COURS...";
      fetch('https://api.themoviedb.org/3/search/movie?api_key=' + TMDB_API_KEY + '&language=fr-FR&query=' + encodeURIComponent(q))
        .then(function(r) { return r.json(); })
        .then(function(res) {
          document.getElementById('boot-screen').style.display = 'none';
          document.getElementById('boot-status-text').innerText = "CONNEXION AU SERVEUR CINÉMA...";
          if(res.results && res.results.length > 0) {
            structuralCatalog = { "Résultats de recherche": res.results }; 
            buildHorizontalCatalogDOM();
          } else alert("Aucun résultat trouvé.");
        }).catch(function() { document.getElementById('boot-screen').style.display = 'none'; });
    }

    function buildHorizontalCatalogDOM() {
      var container = document.getElementById('catalog-rows-box');
      container.innerHTML = "";
      var genres = Object.keys(structuralCatalog);
      
      genres.forEach(function(genre, rIdx) {
        var movies = structuralCatalog[genre];
        if (movies.length === 0) return;

        var rowWrapper = document.createElement('div');
        rowWrapper.id = 'row-wrapper-' + rIdx;
        var titleEl = document.createElement('div');
        titleEl.className = "row-title"; titleEl.innerText = genre;
        rowWrapper.appendChild(titleEl);

        var sliderEl = document.createElement('div');
        sliderEl.className = "horizontal-slider"; sliderEl.id = 'slider-row-' + rIdx;

        movies.forEach(function(movie, cIdx) {
          var card = document.createElement('div');
          card.className = "movie-card";
          card.id = 'card-' + rIdx + '-' + cIdx;
          
          var posterUrl = movie.poster_path ? 'https://image.tmdb.org/t/p/w185' + movie.poster_path : 'https://via.placeholder.com/105x157?text=No+Image';
          card.innerHTML = '<img class="card-poster" src="' + posterUrl + '" alt="">';
          card.addEventListener('click', function() { launchStreamingProcess(movie); });
          sliderEl.appendChild(card);
        });

        rowWrapper.appendChild(sliderEl); container.appendChild(rowWrapper);
      });

      activeRowIndex = 0; activeColIndex = 0; currentZone = "catalog"; applyFocusMatrix();
    }

    function handleMovieSelectionFocus(movie) {
      if(previewDebounceTimer) clearTimeout(previewDebounceTimer);
      document.getElementById('hero-title').innerText = movie.title;
      var year = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
      var note = movie.vote_average ? parseFloat(movie.vote_average).toFixed(1) : '0.0';
      document.getElementById('hero-meta').innerText = year + ' - ' + note + ' ★';
      document.getElementById('hero-overview').innerText = movie.overview || "Aucun résumé disponible.";

      previewDebounceTimer = setTimeout(function() {
        fetch('https://api.themoviedb.org/3/movie/' + movie.id + '/videos?api_key=' + TMDB_API_KEY + '&language=fr-FR')
          .then(function(res) { return res.json(); })
          .then(function(data) {
            var trailer = null;
            if(data.results) {
              for(var i=0; i<data.results.length; i++) {
                if(data.results[i].site === "YouTube" && (data.results[i].type === "Trailer" || data.results[i].type === "Teaser")) {
                  trailer = data.results[i]; break;
                }
              }
            }
            var videoContainer = document.getElementById('hero-video-container');
            if(trailer) {
              videoContainer.innerHTML = '<iframe class="hero-video-iframe" src="https://www.youtube.com/embed/' + trailer.key + '?autoplay=1&mute=1&controls=0&loop=1&playlist=' + trailer.key + '&rel=0&modestbranding=1&iv_load_policy=3&showinfo=0&disablekb=1&fs=0" allow="autoplay"></iframe>';
            } else videoContainer.innerHTML = "";
          }).catch(function() {});
      }, 800); 
    }

    // --- LE CŒUR DU SYSTÈME HYBRIDE (API DIRECTE + SCRAPING REGEX + FALLBACK) ---
    function launchStreamingProcess(movie) {
      document.getElementById('boot-screen').style.display = 'flex';
      document.getElementById('boot-status-text').innerText = "RÉCUPÉRATION DU FLUX VIDÉO...";
      
      // Tentative 1 : Interroger la nouvelle API trouvée via l'ID TMDB
      var targetUrl = "https://api.purstream.store/storage/movies/" + movie.id + "/";
      var proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(targetUrl);

      fetch(proxyUrl)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var content = data.contents || "";
          
          // REGEX MAGIQUE : Cherche n'importe quel lien finissant par .m3u8 ou .mp4 dans la réponse
          var regex = /https?:\/\/[^"'\s\\]+\.(m3u8|mp4)/g;
          var liensTrouves = content.match(regex);

          if (liensTrouves && liensTrouves.length > 0) {
            // Un lien direct a été trouvé !
            var cleanUrl = liensTrouves[0].replace(/\\/g, ''); // Nettoyage antislash json
            document.getElementById('boot-screen').style.display = 'none';
            document.getElementById('boot-status-text').innerText = "CONNEXION AU SERVEUR CINÉMA...";
            openFullScreenPlayer(cleanUrl, movie.title);
          } else {
            // Echec de la méthode directe, bascule sur la méthode par recherche (Fallback)
            fallbackSearchMethod(movie);
          }
        })
        .catch(function(err) {
          // Erreur réseau sur le proxy, on tente la seconde méthode
          fallbackSearchMethod(movie);
        });
    }

    function fallbackSearchMethod(movie) {
      var cleanTitle = movie.title.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, "").trim();

      fetch(currentApiUrl + '/search-bar/search/' + encodeURIComponent(cleanTitle))
        .then(function(res) { return res.json(); })
        .then(function(resData) {
          var matchedMovie = null;
          if (resData && resData.data && resData.data.items && resData.data.items.movies && resData.data.items.movies.items) {
            matchedMovie = resData.data.items.movies.items[0];
          }

          if(matchedMovie && matchedMovie.id) {
            fetch(currentApiUrl + '/media/' + matchedMovie.id + '/sheet')
              .then(function(res) { return res.json(); })
              .then(function(sheetData) {
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('boot-status-text').innerText = "CONNEXION AU SERVEUR CINÉMA...";
                var validSource = null;
                if(sheetData && sheetData.data && sheetData.data.items && sheetData.data.items.urls) {
                  for(var j=0; j<sheetData.data.items.urls.length; j++) {
                    var item = sheetData.data.items.urls[j];
                    if(item.url.indexOf('.m3u8') !== -1 || item.url.indexOf('.mp4') !== -1) {
                      validSource = item; break;
                    }
                  }
                }
                
                if(validSource) openFullScreenPlayer(validSource.url, movie.title);
                else alert("Aucun flux vidéo compatible trouvé.");
              }).catch(function() { restoreBootScreen(); });
          } else {
            restoreBootScreen();
            alert("Film non synchronisé sur le serveur de streaming.");
          }
        }).catch(function() { restoreBootScreen(); });
    }
    
    function restoreBootScreen() {
      document.getElementById('boot-screen').style.display = 'none';
      document.getElementById('boot-status-text').innerText = "CONNEXION AU SERVEUR CINÉMA...";
    }

    function openFullScreenPlayer(url, title) {
      document.getElementById('player-loading-overlay').style.display = 'flex';
      document.getElementById('video-container').style.display = 'block';
      document.getElementById('player-movie-title').innerText = title;
      document.getElementById('hero-video-container').innerHTML = ''; 
      
      if (video.textTracks) {
        for (var i = 0; i < video.textTracks.length; i++) {
          video.textTracks[i].mode = 'disabled';
        }
      }

      if (url.indexOf('.m3u8') !== -1) {
        if (Hls.isSupported()) { var hls = new Hls(); hls.loadSource(url); hls.attachMedia(video); }
        else if (video.canPlayType('application/vnd.apple.mpegurl')) video.src = url;
      } else video.src = url;
      
      video.play();
      currentZone = "player_controls"; activePlayerControlIndex = 1;
      applyFocusMatrix(); triggerTemporaryUiControls();
    }

    function closePlayer() {
      video.pause(); video.src = "";
      document.getElementById('video-container').style.display = 'none';
      currentZone = "catalog"; applyFocusMatrix();
      
      var genres = Object.keys(structuralCatalog);
      handleMovieSelectionFocus(structuralCatalog[genres[activeRowIndex]][activeColIndex]);
    }

    function playerTogglePlay(e) {
      if(e) e.stopPropagation();
      var path = document.querySelector('#p-svg-play path');
      if (video.paused) { video.play(); path.setAttribute('d', "M6 19h4V5H6v14zm8-14v14h4V5h-4z"); }
      else { video.pause(); path.setAttribute('d', "M8 5v14l11-7z"); }
    }

    function triggerIncrementalSeek(direction) {
      triggerTemporaryUiControls();
      if(seekDebounceTimer) clearTimeout(seekDebounceTimer);
      seekAccumulator += (direction * 10);
      var hud = document.getElementById('seek-hud');
      document.getElementById('seek-hud-val').innerText = (seekAccumulator > 0 ? "+" : "") + seekAccumulator + "s";
      hud.style.display = 'block';

      seekDebounceTimer = setTimeout(function() {
        var newTime = video.currentTime + seekAccumulator;
        if(newTime < 0) newTime = 0;
        if(newTime > video.duration) newTime = video.duration;
        video.currentTime = newTime; seekAccumulator = 0; hud.style.display = 'none';
      }, 500);
    }

    function playerRewind(e) { if(e) e.stopPropagation(); triggerIncrementalSeek(-1); }
    function playerForward(e) { if(e) e.stopPropagation(); triggerIncrementalSeek(1); }

    function playerCycleRatio(e) {
      if(e) e.stopPropagation();
      currentRatioIndex = (currentRatioIndex + 1) % ratioModes.length;
      video.style.objectFit = ratioModes[currentRatioIndex];
    }

    function triggerTemporaryUiControls() {
      var ui = document.getElementById('player-ui-controls');
      ui.classList.add('show');
      clearTimeout(uiControlsTimer);
      uiControlsTimer = setTimeout(function() { if(currentZone !== "player_controls") ui.classList.remove('show'); }, 3500);
    }

    video.addEventListener('playing', function() { document.getElementById('player-loading-overlay').style.display = 'none'; });

    video.addEventListener('timeupdate', function() {
      if(!video.duration) return;
      document.getElementById('player-progress-bar').style.width = (video.currentTime / video.duration) * 100 + '%';
      var cm = Math.floor(video.currentTime / 60);
      var cs = Math.floor(video.currentTime % 60);
      var tm = Math.floor(video.duration / 60);
      var ts = Math.floor(video.duration % 60);
      
      cm = cm < 10 ? '0'+cm : cm;
      cs = cs < 10 ? '0'+cs : cs;
      tm = tm < 10 ? '0'+tm : tm;
      ts = ts < 10 ? '0'+ts : ts;
      
      document.getElementById('player-time-display').innerText = cm + ":" + cs + " / " + tm + ":" + ts;
    });

    function applyFocusMatrix() {
      document.getElementById('search-query').classList.remove('focused');
      document.getElementById('search-btn').classList.remove('focused');
      var cards = document.querySelectorAll('.movie-card');
      for(var i=0; i<cards.length; i++) cards[i].classList.remove('focused');
      var btns = document.querySelectorAll('.round-player-btn');
      for(var j=0; j<btns.length; j++) btns[j].classList.remove('focused');

      if (currentZone === "search_input") {
        document.getElementById('search-query').classList.add('focused'); document.getElementById('search-query').focus();
      } 
      else if (currentZone === "search_btn") {
        document.getElementById('search-btn').classList.add('focused');
      } 
      else if (currentZone === "catalog") {
        var activeCard = document.getElementById('card-' + activeRowIndex + '-' + activeColIndex);
        if(activeCard) {
          activeCard.classList.add('focused');
          activeCard.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
          
          var genres = Object.keys(structuralCatalog);
          var targetMovie = structuralCatalog[genres[activeRowIndex]][activeColIndex];
          if(targetMovie) handleMovieSelectionFocus(targetMovie);
        }
      }
      else if (currentZone === "player_controls") {
        var pBtns = [ document.getElementById('p-btn-rewind'), document.getElementById('p-btn-play'), document.getElementById('p-btn-forward'), document.getElementById('p-btn-ratio') ];
        if(pBtns[activePlayerControlIndex]) pBtns[activePlayerControlIndex].classList.add('focused');
      }
    }

    window.addEventListener('keydown', function(e) {
      if (e.keyCode === 37 || e.keyCode === 38 || e.keyCode === 39 || e.keyCode === 40) {
        e.preventDefault();
      }

      if (isPlayerOpen()) {
        if (e.keyCode === 8 || e.keyCode === 27) { closePlayer(); return; }
        triggerTemporaryUiControls();

        if (currentZone === "player_controls") {
          switch(e.keyCode) {
            case 37: if(activePlayerControlIndex > 0) activePlayerControlIndex--; applyFocusMatrix(); break; 
            case 39: if(activePlayerControlIndex < 3) activePlayerControlIndex++; applyFocusMatrix(); break; 
            case 38: currentZone = "player_video_zone"; applyFocusMatrix(); break; 
            case 13: 
              var pBtns = [document.getElementById('p-btn-rewind'), document.getElementById('p-btn-play'), document.getElementById('p-btn-forward'), document.getElementById('p-btn-ratio')];
              if(pBtns[activePlayerControlIndex]) pBtns[activePlayerControlIndex].click();
              break;
          }
        } else { 
          switch(e.keyCode) {
            case 37: triggerIncrementalSeek(-1); break; 
            case 39: triggerIncrementalSeek(1); break;  
            case 13: playerTogglePlay(); break;          
            case 40: currentZone = "player_controls"; activePlayerControlIndex = 1; applyFocusMatrix(); break; 
          }
        }
        return;
      }

      var genres = Object.keys(structuralCatalog);
      switch(currentZone) {
        case "catalog":
          if(e.keyCode === 37) { 
            if(activeColIndex > 0) activeColIndex--; 
            applyFocusMatrix();
          }
          else if(e.keyCode === 39) { 
            if(activeColIndex < structuralCatalog[genres[activeRowIndex]].length - 1) activeColIndex++;
            applyFocusMatrix();
          }
          else if(e.keyCode === 38) { 
            if(activeRowIndex > 0) {
              activeRowIndex--;
              activeColIndex = 0;
              applyFocusMatrix();
            } else {
              currentZone = "search_btn"; 
              applyFocusMatrix();
            }
          } 
          else if(e.keyCode === 40) { 
            if(activeRowIndex < genres.length - 1) {
              activeRowIndex++;
              activeColIndex = 0;
              applyFocusMatrix();
            }
          }
          else if(e.keyCode === 13) { 
            var targetCard = document.getElementById('card-' + activeRowIndex + '-' + activeColIndex);
            if(targetCard) targetCard.click();
          }
          break;

        case "search_input":
          if(e.keyCode === 39) { currentZone = "search_btn"; applyFocusMatrix(); }
          else if(e.keyCode === 40) { currentZone = "catalog"; activeRowIndex = 0; activeColIndex = 0; applyFocusMatrix(); }
          else if(e.keyCode === 13) { triggerSearch(); }
          break;

        case "search_btn":
          if(e.keyCode === 37) { currentZone = "search_input"; applyFocusMatrix(); }
          else if(e.keyCode === 40) { currentZone = "catalog"; activeRowIndex = 0; activeColIndex = 0; applyFocusMatrix(); }
          else if(e.keyCode === 13) { triggerSearch(); }
          break;
      }
    });
  </script>
</body>
</html>
