<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>VIDÉOCLUB v19.5 - Pro 60" 4K Edition</title>
  <style>
    :root {
      --primary: #ff0033;
      --bg-dark: #070709;
      --surface: #141419;
      --text: #ffffff;
      /* MODIFICATION : Échelle ajustée parfaite pour 60" 4K */
      --card-width: 165px;
      --card-height: 247px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      width: 100vw;
      height: 100vh;
      touch-action: pan-x pan-y;
    }

    #boot-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-dark); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 25000;
    }
    .boot-text { color: #fff; font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; margin-top: 25px; letter-spacing: 2px; text-transform: uppercase; }
    
    .netflix-loader { 
      width: 44px; height: 44px; 
      border: 4px solid rgba(0, 195, 255, 0.2); 
      border-top-color: #00c3ff; 
      box-shadow: 0 0 15px rgba(0, 195, 255, 0.5), inset 0 0 10px rgba(0, 195, 255, 0.3);
      border-radius: 50%; 
      animation: spinLoader 0.8s linear infinite; 
    }
    @keyframes spinLoader { to { transform: rotate(360deg); } }

    .hero-preview-zone { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: var(--bg-dark); z-index: 1; pointer-events: none; }
    .hero-bg-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
    
    #hero-bg-image {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover; background-position: top center; background-repeat: no-repeat;
    }
    .hero-bg-fade { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to right, rgba(7,7,9,1) 0%, rgba(7,7,9,0.5) 45%, transparent 100%), linear-gradient(to top, rgba(7,7,9,1) 0%, rgba(7,7,9,0.4) 40%, transparent 100%); z-index: 2; pointer-events: none; }

    .app-layout { position: relative; z-index: 10; display: flex; flex-direction: column; width: 100vw; height: 100vh; pointer-events: auto; }

    .header-zone { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); }
    .nav-container { display: flex; align-items: center; gap: 28px; }

    .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; outline: none; }
    .nav-bracket-row { display: flex; align-items: center; gap: 5px; }
    .nav-bracket { font-family: 'Courier New', Courier, monospace; font-size: 18px; font-weight: 900; color: transparent; transition: color 0.2s, opacity 0.2s; line-height: 1; }
    .text-logo { font-family: 'Courier New', Courier, monospace; font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; transition: color 0.2s; line-height: 1; }

    .nav-item.videoclub .text-logo { color: var(--primary); text-shadow: 0 0 12px rgba(255,0,51,0.4); }
    .nav-item.videoclub.active .text-logo { color: #fff; text-shadow: none; }
    .nav-item.videoclub.active .nav-bracket { color: #fff; }
    .nav-item:focus, .nav-item.focused, .nav-item:active { transform: scale(1.05); }
    .nav-item.videoclub.focused .nav-bracket, .nav-item.videoclub:focus .nav-bracket { color: var(--primary); }

    .header-right { display: flex; align-items: center; gap: 20px; }
    .api-status { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; background: rgba(20,20,25,0.85); border: 2px solid transparent; cursor: pointer; transition: all 0.2s; outline: none; }
    .api-status:focus, .api-status.focused, .api-status:active { border-color: #fff; transform: scale(1.05); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .api-status.ok .status-dot { background-color: #46d369; box-shadow: 0 0 8px #46d369; }
    .api-status.error .status-dot { background-color: var(--primary); box-shadow: 0 0 8px var(--primary); }
    .api-status.ok .status-text { color: #46d369; }
    .api-status.error .status-text { color: var(--primary); }
    .clock-text { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.55); letter-spacing: 1px; }

    .search-box { display: flex; gap: 8px; align-items: center; }
    .search-input { background-color: rgba(20,20,25,0.85); border: 2px solid transparent; color: white; padding: 8px 16px; border-radius: 20px; font-size: 14px; outline: none; width: 200px; transition: all 0.2s; }
    .search-input:focus, .search-input.focused { border-color: #fff; background-color: #1c1c24; }
    .search-button { background-color: rgba(20,20,25,0.85); color: white; border: 2px solid transparent; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; outline: none; }
    .search-button svg { width: 16px; height: 16px; fill: white; }
    .search-button:focus, .search-button.focused, .search-button:active { background-color: #fff; }
    .search-button:focus svg, .search-button.focused svg, .search-button:active svg { fill: #000; }

    .hero-text-content { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 44px 15px 44px; max-width: 50%; }
    .hero-title { font-size: 42px; font-weight: 900; line-height: 1.1; margin-bottom: 10px; text-shadow: 0 3px 10px rgba(0,0,0,0.9); }
    .hero-meta { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    .imdb-badge { background: #f5c518; color: #000; padding: 2px 5px; border-radius: 3px; font-weight: 900; font-size: 11px; }
    .match-text { color: #46d369; font-weight: bold; }
    .hero-overview { font-size: 15px; color: #dddddd; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }

    .catalog-rows-container { height: 50vh; overflow-y: auto; padding: 0 0 40px 0; display: flex; flex-direction: column; gap: 24px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .catalog-rows-container::-webkit-scrollbar { display: none; }
    .catalog-row-wrapper { display: flex; flex-direction: column; }
    .row-title-container { display: flex; justify-content: space-between; align-items: center; padding: 0 44px 8px 44px; }
    .row-title { font-size: 18px; font-weight: 700; color: #e2e2e2; }
    .horizontal-slider { display: flex; gap: 14px; overflow-x: auto; overflow-y: visible; padding: 8px 44px 12px 44px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .horizontal-slider::-webkit-scrollbar { display: none; }

    .movie-card { width: var(--card-width); height: var(--card-height); flex-shrink: 0; background-color: var(--surface); border-radius: 7px; overflow: visible; border: 3px solid transparent; cursor: pointer; position: relative; box-shadow: 0 4px 14px rgba(0,0,0,0.6); transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease; outline: none; will-change: transform; transform: translateZ(0); backface-visibility: hidden; }
    .card-inner { width: 100%; height: 100%; border-radius: 5px; overflow: hidden; position: relative; }
    .card-poster { width: 100%; height: 100%; object-fit: cover; display: block; background-color: #1a1a22; }
    
    /* MODIFICATION : Barre de progression sur les cartes */
    .card-progress-bg { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: rgba(255,255,255,0.2); z-index: 20; }
    .card-progress-fill { height: 100%; background: var(--primary); width: 0%; box-shadow: 0 0 5px var(--primary); }

    .card-overlay { position: absolute; bottom: 4px; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.96) 0%, rgba(0,0,0,0.55) 55%, transparent 100%); padding: 12px 10px 8px 10px; display: flex; flex-direction: column; gap: 3px; z-index: 10; }
    .card-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .card-meta-line { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: bold; color: rgba(255,255,255,0.75); }
    .card-imdb { background: #f5c518; color: #000; padding: 1px 4px; border-radius: 2px; font-size: 9px; font-weight: 900; }
    .card-match { color: #46d369; }
    .movie-card:focus, .movie-card.focused { outline: none; transform: scale(1.07) translateZ(0); border-color: #ffffff; box-shadow: 0 8px 28px rgba(0,0,0,0.9), 0 0 0 2px rgba(255,255,255,0.15); z-index: 100; }
    .movie-card:active { transform: scale(0.98) translateZ(0); border-color: var(--primary); }

    /* MENU ACTION */
    #action-menu-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 45000; display: none; align-items: center; justify-content: center; flex-direction: column; }
    .action-menu-box { background: #141419; border: 2px solid rgba(255,255,255,0.2); padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 15px; min-width: 280px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
    .action-btn { background: rgba(255,255,255,0.1); color: #fff; padding: 15px 25px; border-radius: 8px; font-size: 18px; font-weight: bold; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; outline: none; }
    .action-btn.focused { background: #fff; color: #000; border-color: var(--primary); transform: scale(1.05); box-shadow: 0 0 15px rgba(255,255,255,0.5); }

    /* LECTEUR VIDÉO */
    #video-container { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 30000; pointer-events: auto; }
    video::-webkit-media-controls { display: none !important; opacity: 0 !important; -webkit-appearance: none !important; }
    #video-player { width: 100%; height: 100%; background: #000; object-fit: contain; }
    #player-loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 31000; pointer-events: none; }

    .seek-side-overlay { position: absolute; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.85); font-size: 44px; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 31000; text-shadow: 0 2px 10px rgba(0,0,0,0.9); display: flex; align-items: center; }
    #seek-overlay-left { left: 60px; }
    #seek-overlay-right { right: 60px; }
    .seek-side-overlay.show { opacity: 1; }

    .player-top-bar { position: absolute; top: 0; left: 0; right: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent); padding: 30px 40px; display: flex; align-items: center; gap: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; opacity: 0; transition: all 0.25s; z-index: 30200; outline: none; border-bottom: none; text-transform: uppercase; letter-spacing: 1px; }
    .player-top-bar.show { opacity: 1; pointer-events: auto; }
    .player-top-bar:not(.show) { pointer-events: none; }
    .player-top-bar.focused, .player-top-bar:focus, .player-top-bar:active { background: linear-gradient(to bottom, rgba(0,195,255,0.15), transparent); color: #00c3ff; text-shadow: 0 0 12px #00c3ff; transform: scale(1.02); }

    .player-controls-bar { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); padding: 50px 40px 30px 40px; display: flex; flex-direction: column; gap: 16px; opacity: 0; transition: opacity 0.25s; z-index: 30200; }
    .player-controls-bar.show { opacity: 1; pointer-events: auto; }
    .player-controls-bar:not(.show) { pointer-events: none; }

    .progress-touch-zone { width: 100%; height: 36px; display: flex; align-items: center; cursor: pointer; outline: none; }
    .progress-wrapper { width: 100%; height: 5px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; pointer-events: none; transition: all 0.2s; box-sizing: border-box; }
    .progress-touch-zone:hover .progress-wrapper { height: 10px; }
    .progress-touch-zone.focused .progress-wrapper, .progress-touch-zone:focus .progress-wrapper { height: 12px; border: 2px solid #fff; box-shadow: 0 0 12px rgba(255,255,255,0.6); }
    .progress-fill { height: 100%; width: 0%; background: #ffffff; box-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff; }
    
    .ctrl-buttons-line { display: flex; align-items: center; justify-content: center; gap: 24px; }
    .round-player-btn { width: 50px; height: 50px; border-radius: 50%; background-color: #000; border: 2px solid #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; transition: all 0.15s; pointer-events: auto; }
    .round-player-btn svg { width: 22px; height: 22px; fill: #fff; }
    .round-player-btn:focus, .round-player-btn.focused, .round-player-btn:active { background-color: #fff; border-color: #fff; transform: scale(1.15); box-shadow: 0 0 15px rgba(255,255,255,0.8); }
    .round-player-btn:focus svg, .round-player-btn.focused svg, .round-player-btn:active svg { fill: #000; }
    
    .player-txt-info { display: flex; justify-content: space-between; font-size: 15px; color: #ccc; font-weight: bold; }
    #p-btn-cast { display: none; }

    #trailer-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 40000; display: none; align-items: center; justify-content: center; }
    .trailer-box { width: 65vw; height: 36.56vw; background: #000; border-radius: 12px; overflow: hidden; position: relative; border: 2px solid rgba(255,255,255,0.15); box-shadow: 0 15px 50px rgba(0,0,0,0.9); margin-top: 15px; }
    .trailer-iframe { width: 100%; height: 100%; border: none; }
    
    .trailer-close-btn { position: absolute; top: -55px; right: 0; color: #fff; font-size: 28px; font-weight: bold; width: 44px; height: 44px; background: rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; outline: none; }
    .trailer-close-btn.focused { background: #fff; color: #000; border-color: var(--primary); transform: scale(1.1); box-shadow: 0 0 15px rgba(255,255,255,0.5); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <div class="boot-text" id="boot-text-msg">Connexion au serveur cinéma...</div>
  </div>

  <div class="hero-preview-zone" id="hero-banner">
    <div class="hero-bg-container">
      <div id="hero-bg-image"></div>
      <div class="hero-bg-fade"></div>
    </div>
  </div>

  <div class="app-layout">
    <div class="header-zone">
      <div class="nav-container">
        <div class="nav-item active videoclub" id="menu-films" tabindex="0">

      </div>
      
      <div class="header-right">
        <div class="api-status ok" id="api-status-btn" tabindex="0" onclick="retryApiConnection()">

  <script>
    var touchStartX = 0, touchStartY = 0;
    
    document.addEventListener('touchstart', function(e) {
        if(e.changedTouches && e.changedTouches.length > 0) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }
    }, {passive: true});

    document.addEventListener('touchend', function(e) {
        if(e.changedTouches && e.changedTouches.length > 0) {
            var touchEndX = e.changedTouches[0].screenX, touchEndY = e.changedTouches[0].screenY;
            var distance = Math.sqrt(Math.pow(touchEndX - touchStartX, 2) + Math.pow(touchEndY - touchStartY, 2));
            if (distance < 15) {
                var clickableTarget = e.target.closest('.movie-card, .nav-item, .search-button, .api-status, .player-top-bar, .action-btn');
                if (clickableTarget) { clickableTarget.click(); e.preventDefault(); }
            }
        }
    }, {passive: false});

    const TMDB_API_KEY  = "0442e5116bf1245dce171d5ed8a7748c";
    var currentApiUrl = "https://api.purstream.store/api/v1";

        "Le Labyrinthe", "Le Labyrinthe : La Terre brûlée", "Divergente", "Hunger Games"

    function handleKeydown(e) {
      var key = e.keyCode || e.which;

      if (key === 27 || key === 8 || key === 10009) {
        e.preventDefault();   
        e.stopPropagation();  
        
        if (currentZone === 'player') { closePlayer(); return; } 
        else if (currentZone === 'trailer') { closeTrailer(); return; }
        else if (currentZone === 'action_menu') { closeActionMenu(); return; }
        else if (currentZone === 'search') { 
            document.getElementById('search-query').blur(); 
            currentZone = 'catalog'; focusCatalogCard(); return; 
        }
        return;
      }

      if (currentZone === 'catalog') {
        if (key === 13) {
            e.preventDefault();
            if (!enterKeyDownFired) {
                enterKeyDownFired = true;
                longPressTriggered = false;
                var item = structuralCatalog[Object.keys(structuralCatalog)[activeRowIndex]][activeColIndex];
                pressTimer = setTimeout(function() {
                    longPressTriggered = true;
                    openActionMenu(item);
                }, 500);
            }
            return;
        } else {
            enterKeyDownFired = false;
            clearTimeout(pressTimer);
        }
        handleCatalogKeys(key, e);
      } else if (currentZone === 'player') {
        handlePlayerKeys(key, e);
      } else if (currentZone === 'action_menu') {
        handleActionMenuKeys(key, e);
      } else if (currentZone === 'trailer') {
        if (key === 13) { e.preventDefault(); closeTrailer(); }
      } else if (currentZone === 'search') {
        if (key === 40) { 
            document.getElementById('search-query').blur(); 
            currentZone = 'catalog'; focusCatalogCard(); e.preventDefault(); 
        } else if (key === 37) {
            document.getElementById('search-query').blur(); 
            currentZone = 'catalog'; activeMenuIndex = 1; focusMenuItem(1); e.preventDefault();
        }
      }
    }

    function handleKeyup(e) {
        var key = e.keyCode || e.which;
        if (key === 13 && currentZone === 'catalog' && enterKeyDownFired) {
            clearTimeout(pressTimer);
            enterKeyDownFired = false;
            if (!longPressTriggered) {
                var item = structuralCatalog[Object.keys(structuralCatalog)[activeRowIndex]][activeColIndex];
                playMovie(item);
            }
        }
    }

    function detectPurstreamDomain() {
      var cachedApi = localStorage.getItem('ps_api_url');
      var cacheDate = localStorage.getItem('ps_api_date');
      
      if (cachedApi && cacheDate && (Date.now() - parseInt(cacheDate) < 12 * 60 * 60 * 1000)) {
          currentApiUrl = cachedApi;
          setApiStatus(true);
          loadMoviesDatabase();
          return;
      }

      fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://purstream.wiki/?_=' + Date.now()))
        .then(function(res){ return res.text(); })
        .then(function(html){
          var match = html.match(/https?:\/\/purstream\.[a-z]+/gi);
          var tld = "mx";
          if (match) {
            var domains = match.filter(function(u){ return u.toLowerCase().indexOf('purstream.wiki') === -1; });
            if (domains.length) tld = domains[domains.length - 1].toLowerCase().replace(/https?:\/\/purstream\./, '').replace(/\/$/, '');
          }
          currentApiUrl = 'https://api.purstream.' + tld + '/api/v1';
          localStorage.setItem('ps_api_url', currentApiUrl);
          localStorage.setItem('ps_api_date', Date.now());
          setApiStatus(true);
        }).catch(function(){ 
          currentApiUrl = 'https://api.purstream.store/api/v1'; 
          setApiStatus(true);
        }).finally(function() {
          loadMoviesDatabase();
        });
    }

    function fetchWithRetry(url, retries = 2, delay = 1000) {
      return fetch(url).then(function(res) {
        if (!res.ok) {
          if (retries > 0) return new Promise(function(resolve) { setTimeout(resolve, delay); }).then(function() { return fetchWithRetry(url, retries - 1, delay * 1.5); });
          throw new Error("HTTP " + res.status);
        }
        return res.json();
      });
    }

    function processCatalogData(jsonCatalog) {
      structuralCatalog = {};
      var promises = [];
      Object.keys(jsonCatalog).forEach(function(cat) {
        structuralCatalog[cat] = [];
        jsonCatalog[cat].forEach(function(title) {
          var p = fetch('https://api.themoviedb.org/3/search/movie?api_key=' + TMDB_API_KEY + '&language=fr-FR&query=' + encodeURIComponent(title) + '&include_adult=false')
            .then(function(r){ return r.json(); })
            .then(function(res){
              if (res.results && res.results.length > 0) {
                var m = res.results[0]; m._searchTitle = title; structuralCatalog[cat].push(m);
              }
            }).catch(function(){});
          promises.push(p);
        });
      });
      Promise.all(promises).then(function() {
        localStorage.setItem('vidclub_catalog_v19', JSON.stringify(structuralCatalog));
        localStorage.setItem('vidclub_cat_time', Date.now());
        
        document.getElementById('boot-screen').style.display = 'none';
        buildHorizontalCatalogDOM();
        currentZone = 'catalog';
        activeRowIndex = 0; activeColIndex = 0;
      });
    }

    function playMovie(movie) {
      if(document.activeElement) document.activeElement.blur(); 
      currentActiveMovieObj = movie; 
      var movieId = movie.id;
      if (!movieRetryCounts[movieId]) movieRetryCounts[movieId] = 0;

      document.getElementById('boot-screen').style.display = 'flex';
      document.getElementById('boot-text-msg').textContent = "Recherche du flux sécurisé...";
      
      var rawTitle = movie.title || movie.original_title || movie._searchTitle || "";
      var cleanTitle = rawTitle.split(':')[0].split('(')[0].normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9 ]/g, "").trim();
      currentMovieTitle = rawTitle;

      fetchWithRetry(currentApiUrl + '/search-bar/search/' + encodeURIComponent(cleanTitle), 2, 800)
        .then(function(resData) {
          var items = resData && resData.data && resData.data.items; var matchedMovie = null;
          if (items) {
             if (items.movies && items.movies.items && items.movies.items.length > 0) matchedMovie = items.movies.items[0];
             else if (items.items && items.items.length > 0) matchedMovie = items.items[0];
             else if (Array.isArray(items) && items.length > 0) matchedMovie = items[0];
          }
          if(matchedMovie && matchedMovie.id) {
            document.getElementById('boot-text-msg').textContent = "Récupération du lien...";
            return fetchWithRetry(currentApiUrl + '/media/' + matchedMovie.id + '/sheet', 2, 800);
          } else { throw new Error("not_found"); }
        })
        .then(function(sheetData) {
            document.getElementById('boot-screen').style.display = 'none';
            movieRetryCounts[movieId] = 0; 
            var urls = sheetData && sheetData.data && sheetData.data.items && sheetData.data.items.urls;
            var validSource = urls ? urls.find(function(item) { return item.url.includes('.m3u8') || item.url.includes('.mp4'); }) : null;
            if(validSource) launchPlayer(validSource.url, currentMovieTitle);
            else throw new Error("no_stream");
        })
        .catch(function(err) { 
            document.getElementById('boot-screen').style.display = 'none'; 
            if (movieRetryCounts[movieId] < 2) {
                movieRetryCounts[movieId]++;
                showNotAvailable(currentMovieTitle, "Reconnexion automatique (" + movieRetryCounts[movieId] + "/2)...");
                setTimeout(function() { playMovie(movie); }, 3500);
            } else {
                if (err.message === "not_found") showNotAvailable(currentMovieTitle, "Film introuvable sur le serveur.");
                else if (err.message === "no_stream") showNotAvailable(currentMovieTitle, "Aucun flux compatible trouvé.");
                else showNotAvailable(currentMovieTitle, "Serveur instable. Veuillez réessayer.");
                movieRetryCounts[movieId] = 0; 
            }
        });
    }

    /* MODIFICATION : Fonction de Reprise de Lecture intégrée au Lancement */
    function attachResumeLogic() {
        video.addEventListener('loadedmetadata', function() { 
            document.getElementById('player-loading-overlay').style.display = 'none'; 
            disableSubtitles(); 
            
            // Cherche une sauvegarde pour ce film
            if(currentActiveMovieObj) {
                var savedSec = localStorage.getItem('vid_prog_sec_' + currentActiveMovieObj.id);
                if(savedSec) {
                    var st = parseFloat(savedSec);
                    if(st > 0 && st < video.duration) {
                        video.currentTime = st; // Saute directement au bon moment !
                        showNotAvailable("Reprise de la lecture", formatTime(st));
                    }
                }
            }
        }, { once: true });
    }

    function launchPlayer(url, title) {
      isPlayerActive = true; ccActive = false; document.getElementById('p-btn-cc').style.borderColor = '#fff';
      currentZone = 'player'; 
      
      playerFocusZone = 2; 
      playerBtnIndex = 2;  
      focusPlayerElement();

      var container = document.getElementById('video-container'); container.style.display = 'block';
      document.getElementById('player-movie-title').textContent = title || '';
      document.getElementById('player-loading-overlay').style.display = 'flex';
      document.getElementById('p-svg-play').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>';

      setTimeout(function() { showPlayerControls(); }, 100);

      if (hls) { hls.destroy(); hls = null; }
      video.removeAttribute('src');

      if (Hls.isSupported() && url.includes('.m3u8')) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: false });
        hls.loadSource(url); hls.attachMedia(video);
        
        attachResumeLogic(); // Initialise la reprise de lecture

        hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
        
        hls.on(Hls.Events.ERROR, function(event, data) { 
            if (data.fatal) { 
                switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        hls.startLoad();
                        break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                        hls.recoverMediaError();
                        break;
                    default:
                        hls.destroy();
                        document.getElementById('player-loading-overlay').style.display = 'none'; 
                        closePlayer();
                        showNotAvailable(currentMovieTitle, "Crash du lecteur, reconnexion...");
                        if (currentActiveMovieObj) setTimeout(function(){ playMovie(currentActiveMovieObj); }, 2500);
                        break;
                }
            } 
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl') || url.includes('.mp4')) {
        video.src = url; video.play();
        attachResumeLogic(); // Initialise la reprise de lecture
        
        video.addEventListener('error', function() {
            closePlayer();
            showNotAvailable(currentMovieTitle, "Crash natif, reconnexion...");
            if (currentActiveMovieObj) setTimeout(function(){ playMovie(currentActiveMovieObj); }, 2500);
        }, { once: true });
      }
      video.addEventListener('timeupdate', updateProgressBar);
    }

    function disableSubtitles() { if (hls && typeof hls.subtitleTrack !== 'undefined') hls.subtitleTrack = -1; for (var i = 0; i < video.textTracks.length; i++) { video.textTracks[i].mode = 'disabled'; } }

    function closePlayer(e) {
      if (e) e.stopPropagation(); isPlayerActive = false; document.getElementById('video-container').style.display = 'none';
      video.pause(); if (hls) { hls.destroy(); hls = null; }
      video.removeEventListener('timeupdate', updateProgressBar); video.src = ""; video.removeAttribute('src'); video.load(); clearTimeout(uiControlsTimer);

      var card = document.getElementById('card-' + activeRowIndex + '-' + activeColIndex);
      if (card) { card.focus(); var genres = Object.keys(structuralCatalog); if(genres.length > activeRowIndex) { schedulePreview(structuralCatalog[genres[activeRowIndex]][activeColIndex]); } }
      history.pushState({ page: "home" }, '', location.href);
    }

    function playerTogglePlay(e) {
      if (e) e.stopPropagation();
      if (video.paused) { video.play(); document.getElementById('p-svg-play').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>'; } 
      else { video.pause(); document.getElementById('p-svg-play').innerHTML = '<path d="M8 5v14l11-7z"></path>'; } showPlayerControls();
    }

    function showSeekLabel(delta) {
        seekSum += delta;
        var leftEl = document.getElementById('seek-overlay-left');
        var rightEl = document.getElementById('seek-overlay-right');
        
        var rewindIcon = '<svg viewBox="0 0 24 24" style="width: 40px; height: 40px; fill: white; vertical-align: middle; margin-right: 10px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6 8.5 6V6l-8.5 6z"></path></svg>';
        var forwardIcon = '<svg viewBox="0 0 24 24" style="width: 40px; height: 40px; fill: white; vertical-align: middle; margin-left: 10px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"></path></svg>';

        leftEl.classList.remove('show');
        rightEl.classList.remove('show');

        if (seekSum < 0) {
            leftEl.innerHTML = rewindIcon + Math.abs(seekSum) + 'sec';
            leftEl.classList.add('show');
        } else if (seekSum > 0) {
            rightEl.innerHTML = Math.abs(seekSum) + 'sec' + forwardIcon;
            rightEl.classList.add('show');
        }
        
        clearTimeout(seekLabelTimer);
        seekLabelTimer = setTimeout(function() {
            leftEl.classList.remove('show');
            rightEl.classList.remove('show');
            seekSum = 0;
        }, 1000);
        showPlayerControls();
    }

    function doSeek(delta) { 
        if (!video.duration) return; 
        video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + delta)); 
        updateProgressBar(); 
    }

    function playerRewind(e) { if (e) e.stopPropagation(); showSeekLabel(-10); doSeek(-10); }
    function playerForward(e) { if (e) e.stopPropagation(); showSeekLabel(10); doSeek(10); }
    
    function playerCycleRatio(e) { if (e) e.stopPropagation(); currentRatioIndex = (currentRatioIndex + 1) % ratioModes.length; video.style.objectFit = ratioModes[currentRatioIndex]; showPlayerControls(); }

    function startDrag(e) {
        if (!video.duration || e.target.closest('.round-player-btn')) return;
        isDraggingProgress = true;
        wasPlayingBeforeDrag = !video.paused;
        video.pause();
        updateDragPosition(e);
    }
    
    function onDrag(e) {
        if (!isDraggingProgress) return;
        e.preventDefault();
        updateDragPosition(e);
        showPlayerControls();
    }
    
    function endDrag(e) {
        if (isDraggingProgress) {
            isDraggingProgress = false;
            if (wasPlayingBeforeDrag) video.play();
        }
    }

    function updateDragPosition(e) {
        var clientX = e.touches ? e.touches[0].clientX : e.clientX;
        var rect = document.getElementById('progress-container').getBoundingClientRect();
        var pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        video.currentTime = pos * video.duration;
        updateProgressBar();
    }

    function seekFromProgressBar(e) {
        if (isDraggingProgress) return;
        if (e) e.stopPropagation(); 
        if (!video.duration) return; 
        var rect = document.getElementById('progress-container').getBoundingClientRect(); 
        var pos = (e.clientX - rect.left) / rect.width; 
        video.currentTime = pos * video.duration; 
        updateProgressBar(); showPlayerControls(); 
    }

    /* MODIFICATION : Sauvegarde silencieuse de la progression pendant la lecture */
    function updateProgressBar() {
      if (!video.duration) return;
      var pct = (video.currentTime / video.duration) * 100;
      document.getElementById('player-progress-bar').style.width = pct + '%';
      document.getElementById('player-time-display').textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
      
      // Sauvegarde dans la mémoire de la télé après 10 secondes de visionnage
      if(currentActiveMovieObj && video.currentTime > 10) {
          if (pct > 95) {
              localStorage.removeItem('vid_prog_sec_' + currentActiveMovieObj.id);
              localStorage.removeItem('vid_prog_pct_' + currentActiveMovieObj.id);
          } else {
              localStorage.setItem('vid_prog_sec_' + currentActiveMovieObj.id, video.currentTime);
              localStorage.setItem('vid_prog_pct_' + currentActiveMovieObj.id, pct);
          }
      }
    }
    
    function formatTime(sec) { sec = Math.floor(sec) || 0; return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0'); }

    function showPlayerControls() {
      var bar = document.getElementById('player-ui-controls'); var topBar = document.getElementById('player-top-bar');
      bar.classList.add('show'); topBar.classList.add('show'); clearTimeout(uiControlsTimer);
      if(!isDraggingProgress) {
         uiControlsTimer = setTimeout(function(){ bar.classList.remove('show'); topBar.classList.remove('show'); }, 4000);
      }
    }

    function focusPlayerElement() {
        document.querySelectorAll('.round-player-btn, .player-top-bar, .progress-touch-zone').forEach(function(el){ el.classList.remove('focused'); });
        if (playerFocusZone === 0) { document.getElementById('player-top-bar').classList.add('focused'); } 
        else if (playerFocusZone === 1) { document.getElementById('progress-container').classList.add('focused'); } 
        else { document.getElementById(PLAYER_BUTTONS[playerBtnIndex]).classList.add('focused'); }
    }

    function handlePlayerKeys(key, e) {
      var uiBar = document.getElementById('player-ui-controls'); var isUIVisible = uiBar.classList.contains('show');
      
      if (!isUIVisible) {
        if (key === 13 || key === 32) { e.preventDefault(); playerTogglePlay(null); showPlayerControls(); return; }
        else if (key === 38 || key === 40) { e.preventDefault(); showPlayerControls(); return; }
        else if (key === 37) { e.preventDefault(); playerRewind(null); return; } 
        else if (key === 39) { e.preventDefault(); playerForward(null); return; } 
      }

      if (key === 38) { 
          if (playerFocusZone === 2) { playerFocusZone = 1; } 
          else if (playerFocusZone === 1) { playerFocusZone = 0; } 
          focusPlayerElement(); showPlayerControls(); e.preventDefault();
      } else if (key === 40) { 
          if (playerFocusZone === 0) { playerFocusZone = 1; } 
          else if (playerFocusZone === 1) { playerFocusZone = 2; } 
          focusPlayerElement(); showPlayerControls(); e.preventDefault();
      } else if (key === 37) { 
          if (playerFocusZone === 1) { playerRewind(null); } 
          else if (playerFocusZone === 2) {
              do { playerBtnIndex = Math.max(0, playerBtnIndex - 1); } 
              while (document.getElementById(PLAYER_BUTTONS[playerBtnIndex]).style.display === 'none' && playerBtnIndex > 0);
              focusPlayerElement(); showPlayerControls();
          } e.preventDefault();
      } else if (key === 39) { 
          if (playerFocusZone === 1) { playerForward(null); } 
          else if (playerFocusZone === 2) {
              do { playerBtnIndex = Math.min(PLAYER_BUTTONS.length - 1, playerBtnIndex + 1); } 
              while (document.getElementById(PLAYER_BUTTONS[playerBtnIndex]).style.display === 'none' && playerBtnIndex < PLAYER_BUTTONS.length - 1);
              focusPlayerElement(); showPlayerControls();
          } e.preventDefault();
      } else if (key === 13 || key === 32) { 
          e.preventDefault(); 
          if (playerFocusZone === 0) { closePlayer(); } 
          else if (playerFocusZone === 1) { playerTogglePlay(null); } 
          else { document.getElementById(PLAYER_BUTTONS[playerBtnIndex]).click(); showPlayerControls(); }
      }
    }

    function handleMenuKeys(key, e) {
      if (key === 37) { activeMenuIndex = 0; focusMenuItem(activeMenuIndex); }
      else if (key === 39) {
        if (activeMenuIndex < 1) { activeMenuIndex++; focusMenuItem(activeMenuIndex); }
        else { 
            currentZone = 'search'; 
            document.querySelectorAll('.nav-item, .api-status').forEach(function(el){ el.classList.remove('focused'); });
            var sq = document.getElementById('search-query');
            sq.classList.add('focused'); 
            sq.focus(); 
        }
      } else if (key === 40 || key === 13) {
        if (activeMenuIndex === 1 && key === 13) { retryApiConnection(); } 
        else if (Object.keys(structuralCatalog).length > 0) { currentZone = 'catalog'; focusCatalogCard(); }
      }
      e.preventDefault();
    }

    function handleCatalogKeys(key, e) {
      var genres = Object.keys(structuralCatalog).filter(function(g){ return structuralCatalog[g].length > 0; });
      if (key === 38) {
        if (activeRowIndex === 0) { 
            currentZone = 'search'; 
            document.querySelectorAll('.movie-card').forEach(function(el){ el.classList.remove('focused'); });
            var sq = document.getElementById('search-query');
            sq.classList.add('focused');
            sq.focus();
        }
        else { activeRowIndex--; var row = structuralCatalog[genres[activeRowIndex]]; activeColIndex = Math.min(activeColIndex, row.length - 1); focusCatalogCard(); scrollRowIntoView(activeRowIndex); }
        e.preventDefault();
      } else if (key === 40) {
        if (activeRowIndex < genres.length - 1) { activeRowIndex++; var row2 = structuralCatalog[genres[activeRowIndex]]; activeColIndex = Math.min(activeColIndex, row2.length - 1); focusCatalogCard(); scrollRowIntoView(activeRowIndex); }
        e.preventDefault();
      } else if (key === 37) {
        if (activeColIndex > 0) { activeColIndex--; focusCatalogCard(); scrollCardIntoView(activeRowIndex, activeColIndex); } e.preventDefault();
      } else if (key === 39) {
        var row3 = structuralCatalog[genres[activeRowIndex]];
        if (row3 && activeColIndex < row3.length - 1) { activeColIndex++; focusCatalogCard(); scrollCardIntoView(activeRowIndex, activeColIndex); } e.preventDefault();
      }
    }

    function focusMenuItem(idx) {
      document.querySelectorAll('.nav-item, .api-status').forEach(function(el){ el.classList.remove('focused'); });
      document.getElementById('search-query').classList.remove('focused');
      var items = ['menu-films', 'api-status-btn']; 
      var el = document.getElementById(items[idx]);
      if (el) { el.classList.add('focused'); el.focus(); }
    }
    
    function focusCatalogCard() { var card = document.getElementById('card-' + activeRowIndex + '-' + activeColIndex); if (card) card.focus(); }
    function scrollRowIntoView(rIdx) { var wrapper = document.getElementById('row-wrapper-' + rIdx); if (wrapper) wrapper.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    function scrollCardIntoView(rIdx, cIdx) {
      var slider = document.getElementById('slider-row-' + rIdx); var card = document.getElementById('card-' + rIdx + '-' + cIdx);
      if (!slider || !card) return;
      var cardLeft = card.offsetLeft - slider.offsetLeft, cardRight = cardLeft + card.offsetWidth, sl = slider.scrollLeft, sw = slider.clientWidth;
      if (cardLeft < sl + 44) slider.scrollTo({ left: Math.max(0, cardLeft - 44), behavior: 'smooth' });
      else if (cardRight > sl + sw - 40) slider.scrollTo({ left: cardRight - sw + 40, behavior: 'smooth' });
    }

    window.addEventListener('popstate', function(e) {
      if (isPlayerActive) closePlayer();
      else if (currentZone === 'trailer') closeTrailer();
      else if (currentZone === 'action_menu') closeActionMenu();
      
      history.pushState({ page: "home" }, '', location.href);
    });
  </script>
</body>
</html>
